name: E2E tests

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright 1.56 不支援 ubuntu-latest（26.04）的 chromium 相依套件
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
