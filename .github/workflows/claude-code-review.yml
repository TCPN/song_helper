name: Claude Code Review

# 有新 PR（或 PR 推了新 commit）時，讓 Claude 自動 review 並在 PR 上留意見。
# 需要：repo 安裝 Claude GitHub App，並設定 secret CLAUDE_CODE_OAUTH_TOKEN（或改用 ANTHROPIC_API_KEY）。
# 注意：claude-code-action 會檢查這個檔案和預設分支（master）上的版本一致，所以改動要同步進 master 才會生效。

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同一個 PR 連續推送時，取消還在跑的舊 review，只留最新一次。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 若改用 API key，把上一行換成：
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            EVENT: ${{ github.event.action }}

            請 review 這個 pull request，重點：
            - 正確性與潛在 bug
            - 是否破壞網址 hash（#song_id=…&transpose=…）這個對外契約
            - 行為改變時，Playwright 測試（tests/）是否一併更新
            - 安全性與效能問題

            請遵守 repo 根目錄 CLAUDE.md 的維護規則。只留有實質內容的意見，請用繁體中文。

            留言方式：
            - 先用 `gh pr view ${{ github.event.pull_request.number }} --comments` 讀之前的總結和其他人的回覆，
              再用 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              讀已有的行內意見與回覆。
            - 具體問題用 `mcp__github_inline_comment__create_inline_comment` 留在對應的程式行上；
              同樣的問題已經有人留過就不要再留。
            - 每次 review 用 `gh pr comment` 新增一則總結（不要改寫舊的），開頭註明這次看的是哪個 commit。
            - 若之前已經 review 過（例如 EVENT 是 synchronize），總結依序寫兩段：
              1.「這次的修改」：說明上次 review 之後新推送的修改做了什麼，逐一對照之前留言提到的問題，
                說明哪些已被這次修改解決、哪些改了但還不完整，以及新修改本身有沒有新問題。
              2.「目前尚未解決／回應的問題」：彙整到目前為止仍未解決、也還沒有人回覆說明的問題；
                已經有人回覆說明不處理的，標註回覆的結論即可。都處理完了就直接說沒有。
            - 第一次 review 則照常寫一則整體總結。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
