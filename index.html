<!DOCTYPE html>
<html>
<head>
	<title>移調小幫手</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8" />
	
	<link rel="stylesheet" href="style.css" />

	<link href="abcjs-midi.css" media="all" rel="stylesheet" type="text/css">
	<script src="abcjs_midi_5.6.5-min-mod.js" type="text/javascript"></script>
	

	<!--link rel="stylesheet" href="http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.css" /-->
	<!--link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jquerymobile/1.4.3/jquery.mobile.min.css" /-->

	<script type="text/javascript" src="https://www.google.com/jsapi"></script>
	<!-- ***20160831 new: make selected list sortable; start -->
	<!--<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.min.js"></script>-->
	<!-- ***20160831 new: make selected list sortable; end -->
    <script type="text/javascript" src="script.js"></script>
</head>
<body class="fill-viewport">
	<div id='loading_icon' class="fill-viewport">
		<div id='loading_icon_center'>
			Loading...
		</div>
	</div>
	<div id='list_container'>
		<table id='song_list'>
			<thead>
				<tr>
					<th colspan="10">
						<div id="song_list_filters">
							<input id="song_search" type="text" placeholder="search" oninput="filter_song(this.value)"/>
							<div id="clear_search" onmousedown="var input = document.querySelector('#song_search'); input.value=''; input.focus(); input.oninput(); return false;">
							</div>
						</div>
					</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
			<tfoot>
				<tr>
					<td id="found_nothing" colspan="10" class="hide">沒有符合結果</td>
				</tr>
			</tfoot>
		</table>
	</div>
	<div id='score_popup_container'>
		<div id='score_popup_bg' data-close='#score_popup_container' onclick="if(event.target==this)close_score()">
			<div id='score_popup_window'>
				<div id='score_paper'>
				</div>
			</div>
		</div>
		<div id='score_popup_top_bar'>
			<!--select id="visual_transpose">
				<option value="0">No transpose</option>
				<option value="+1">+1</option>
				<option value="+2">+2</option>
				<option value="+3">+3</option>
				<option value="+4">+4</option>
				<option value="+5">+5</option>
				<option value="+6">+6</option>
				<option value="+7">+7</option>
				<option value="+8">+8</option>
				<option value="+9">+9</option>
				<option value="+10">+10</option>
				<option value="+11">+11</option>
				<option value="+12">+12</option>
				<option value="-1">-1</option>
				<option value="-2">-2</option>
				<option value="-3">-3</option>
				<option value="-4">-4</option>
				<option value="-5">-5</option>
				<option value="-6">-6</option>
				<option value="-7">-7</option>
				<option value="-8">-8</option>
				<option value="-9">-9</option>
				<option value="-10">-10</option>
				<option value="-11">-11</option>
				<option value="-12">-12</option>
			</select-->
			<!-- add tabindex to enable the keydown event -->
			<label id="current_song_id"
				data-open="#song_id_popup"
				tabindex="0"
				onclick="openDom(this.dataset.open); _original_song_id = _target_song_id = this.textContent; this.textContent='';"
				onkeydown="song_id_keydown_handler(event)"></label>
			<div id="song_id_popup" class="popup-set popup-bg" data-value="esc"
				onclick="song_id_popup_control(event.target.dataset.value);"
				>
				<div class="popup-window">
					<div class="button cc" data-value="0"></div>
					<div class="button cc" data-value="1"></div>
					<div class="button cc" data-value="2"></div>
					<div class="button cc" data-value="3"></div>
					<div class="button cc" data-value="4"></div>
					<div class="button cc" data-value="5"></div>
					<div class="button cc" data-value="6"></div>
					<div class="button cc" data-value="7"></div>
					<div class="button cc" data-value="8"></div>
					<div class="button cc" data-value="9"></div>
					<div class="button cc" data-value="inc"></div>
					<div class="button cc" data-value="dec"></div>
					<div class="button cc" data-value="del"></div>
					<div class="button cc" data-value="clr"></div>
					<div class="button cc" data-value="esc"></div>
					<div class="button cc" data-value="ent"></div>
				</div>
			</div>
			<span>|</span>
			<label>調性:</label>
			<label id="current_visual_tone"></label>
			<label>移調</label>
			<span class="popup-base">
				<input id="visual_transpose" type="number" value="0"
					onchange="set_transpose(this.value)"/>
				<div class="popup-button-base">
					<a class="popup-button"
						onclick="value_modify.call(this,event)"
						data-target="#visual_transpose"
						data-add="+1"
					>▴</a>
					<a class="popup-button"
						onclick="value_modify.call(this,event)"
						data-target="#visual_transpose"
						data-add="-1"
					>▾</a>
				</div>
			</span>
			<span>|</span>
			<a onclick="window.print()">列印</a>
			<span>|</span>
			<label data-close='#score_popup_container' onclick="close_score()">關閉</label>
		</div>
	</div>
</body>
</html>
