<!DOCTYPE html>
<html>
<head>
	<title>移調小幫手</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8" />

	<link href="abcjs-midi.css" media="all" rel="stylesheet" type="text/css">
	<link href="fix-abcjs-midi.css" media="all" rel="stylesheet" type="text/css">
	<script src="abcjs_midi_5.8.0-min-mod.js" type="text/javascript"></script>
	

	<!--link rel="stylesheet" href="http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.css" /-->
	<!--link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jquerymobile/1.4.3/jquery.mobile.min.css" /-->
	<!--script src="https://code.jquery.com/jquery-1.11.1.min.js"></script-->
	<!--script src="http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.js"></script-->
	<!--script src="https://ajax.googleapis.com/ajax/libs/jquerymobile/1.4.3/jquery.mobile.min.js"></script-->


	<!-- ***20160831 new: make selected list sortable; start -->
	<!--<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.min.js"></script>-->
	<!-- ***20160831 new: make selected list sortable; end -->
	<link rel="stylesheet" href="style.css" />
	<script type="module" src="js/main.js"></script>
	<link rel="icon" href="/images/favicon.png"/>
</head>
<body class="fill-viewport">
	<div id='loading_icon' class="fill-viewport">
		<div id='loading_icon_center'>
			Loading...
		</div>
	</div>
	<div id='list_container'>
		<table id='song_list'>
			<thead>
				<tr>
					<th colspan="10">
						<div id="song_list_filters">
							<input id="song_search" type="search" placeholder="搜尋" autofocus/>
						</div>
					</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
			<tfoot>
				<tr>
					<td id="found_nothing" colspan="10" class="hide">沒有符合結果</td>
				</tr>
			</tfoot>
		</table>
	</div>
	<div id='score_popup_container'>
		<div id='score_popup_bg' data-close='#score_popup_container'>
			<div id='score_popup_window'>
				<div id='score_paper'>
				</div>
			</div>
			<div class="change-song prev"></div>
			<div class="change-song next"></div>
		</div>
		<div id='score_popup_top_bar'>
			<!-- add tabindex to enable the keydown event -->
			<label id="current_song_id"
				data-open="#song_id_popup"
				tabindex="0"></label>
			<div id="song_id_popup" class="popup-set popup-bg" data-value="esc">
				<!-- 按鈕由 js/song-id-input.js 產生 -->
				<div id="song_id_popup_window" class="popup-window"></div>
			</div>
			<span>|</span>
			<label>調性:</label>
			<span id="current_visual_tone"></span>
			<label>移調</label>
			<span class="popup-base">
				<input id="transpose" type="number" value="0"/>
				<div class="popup-button-base">
					<label class="popup-button"
						for="transpose"
						data-target="#transpose"
						data-add="+1"
					>▴</label>
					<label class="popup-button"
						for="transpose"
						data-target="#transpose"
						data-add="-1"
					>▾</label>
				</div>
			</span>
			<!-- wide-only 只在工具列夠寬時顯示，compact-only 只在不夠寬時顯示（js/toolbar.js） -->
			<span class="wide-only">|</span>
			<label class="print-button wide-only">列印</label>
			<span class="wide-only">|</span>
			<label class="play-button wide-only">播放</label>
			<div id="player-set" class="hide">
				<div id="player-control"></div>
			</div>
			<span class="wide-only">|</span>
			<label id="edit_button" class="wide-only" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">編輯
				<div id="editor-menu" class="hide menu" role="menu">
					<div class="menu-bg"></div>
					<label class="chord-editor-item menu-item" role="menuitem" tabindex="0">和弦編輯器</label>
					<label class="song-editor-item menu-item" role="menuitem" tabindex="0">進階編輯器</label>
				</div>
			</label>
			<span class="compact-only">|</span>
			<!-- 工具列不夠寬時，列印、播放、編輯收在這個選單裡 -->
			<div id="more_button" class="compact-only" title="更多" aria-label="更多" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
				</svg>
				<div id="more-menu" class="hide menu" role="menu">
					<div class="menu-bg"></div>
					<span class="print-button menu-item" role="menuitem" tabindex="0">列印</span>
					<span class="play-button menu-item" role="menuitem" tabindex="0">播放</span>
					<span class="chord-editor-item menu-item" role="menuitem" tabindex="0">和弦編輯器</span>
					<span class="song-editor-item menu-item" role="menuitem" tabindex="0">進階編輯器</span>
				</div>
			</div>
			<span>|</span>
			<label id="close_score_button" data-close='#score_popup_container' title="關閉" aria-label="關閉" role="button" tabindex="0">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M5 5 19 19M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
				</svg>
			</label>
		</div>
	</div>
  <div id="info-popup-container">
    <div class="popup-bg">
        <div id="info-popup-window">
            <div class="popup-window-title">
                <button class="popup-window-close"></button>
            </div>
            <div class="popup-window-content"></div>
        </div>
    </div>
</div>
  <div id="feedback_popup" class="">
		<div id="feedback_popup_content" class="no-select">找不到想找的歌嗎？
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdwK5DtTSFJ_1kFJcCZlXpzxbDf5iEUy4tYEn0aFHWpKtdhSg/viewform?usp=sf_link">
      反應意見
      </a>
    </div>
	</div>
</body>
</html>
