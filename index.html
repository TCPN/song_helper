<!DOCTYPE html>
<html>
<head>
	<title>移調小幫手</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8" />

	<link href="abcjs-midi.css" media="all" rel="stylesheet" type="text/css">
	<link href="fix-abcjs-midi.css" media="all" rel="stylesheet" type="text/css">
	<script src="abcjs_midi_5.8.0-min-mod.js" type="text/javascript"></script>
	

	<!--link rel="stylesheet" href="http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.css" /-->
	<!--link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jquerymobile/1.4.3/jquery.mobile.min.css" /-->
	<!--script src="https://code.jquery.com/jquery-1.11.1.min.js"></script-->
	<!--script src="http://code.jquery.com/mobile/1.4.3/jquery.mobile-1.4.3.min.js"></script-->
	<!--script src="https://ajax.googleapis.com/ajax/libs/jquerymobile/1.4.3/jquery.mobile.min.js"></script-->


	<!-- ***20160831 new: make selected list sortable; start -->
	<!--<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.min.js"></script>-->
	<!-- ***20160831 new: make selected list sortable; end -->
	<link rel="stylesheet" href="style.css" />
	<script type="module" src="js/main.js"></script>
	<link rel="icon" href="/images/favicon.png"/>
</head>
<body class="fill-viewport">
	<div id='loading_icon' class="fill-viewport">
		<div id='loading_icon_center'>
			Loading...
		</div>
	</div>
	<div id='list_container'>
		<table id='song_list'>
			<thead>
				<tr>
					<th colspan="10">
						<div id="song_list_filters">
							<input id="song_search" type="search" placeholder="搜尋" autofocus/>
						</div>
					</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
			<tfoot>
				<tr>
					<td id="found_nothing" colspan="10" class="hide">沒有符合結果</td>
				</tr>
			</tfoot>
		</table>
	</div>
	<div id='score_popup_container'>
		<div id='score_popup_bg' data-close='#score_popup_container'>
			<div id='score_popup_window'>
				<div id='score_page'>
					<div id='score_paper'>
					</div>
				</div>
			</div>
			<div class="change-song prev"></div>
			<div class="change-song next"></div>
			<!-- 分頁時的頁碼（js/score-pages.js），只有一頁時不顯示 -->
			<div id="page_indicator" class="hide" aria-live="polite"></div>
			<!-- 設定分頁時的提示列（js/score-pages.js） -->
			<div id="page_break_bar" class="hide" role="toolbar" aria-label="設定分頁">
				<span class="page-break-hint">點兩行之間加入／取消分頁</span>
				<span id="page_break_default" class="page-break-button" role="button" tabindex="0">還原預設</span>
				<span id="page_break_done" class="page-break-button" role="button" tabindex="0">完成</span>
			</div>
		</div>
		<div id='score_popup_top_bar'>
			<!-- add tabindex to enable the keydown event -->
			<label id="current_song_id"
				data-open="#song_id_popup"
				tabindex="0"></label>
			<div id="song_id_popup" class="popup-set popup-bg" data-value="esc">
				<!-- 按鈕由 js/song-id-input.js 產生 -->
				<div id="song_id_popup_window" class="popup-window"></div>
			</div>
			<span class="separator">|</span>
			<!-- 調性按鈕和移調選單包在一起，選單就能對齊在按鈕正下方 -->
			<span id="key_group">
				<!-- 「調性:」、調性和移調合成一顆按鈕：顯示目前的調與移調半音數，點了才出現 −／半音數／＋ -->
				<div id="transpose_button" title="移調" aria-label="移調" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
					<span class="key-label">調性:</span> <span id="tone_wrap"><span id="current_visual_tone"></span><span id="transpose_badge"></span></span>
				</div>
				<div id="transpose-menu" class="hide menu">
					<div class="transpose-row">
						<span class="step-button" data-target="#transpose" data-add="-1" title="降一個半音" role="button" tabindex="0">−</span>
						<output id="transpose" aria-label="移調半音數">0</output>
						<span class="step-button" data-target="#transpose" data-add="+1" title="升一個半音" role="button" tabindex="0">+</span>
					</div>
				</div>
			</span>
			<!-- wide-only 只在工具列夠寬時顯示，compact-only 只在不夠寬時顯示（js/toolbar.js）。
			     分隔線只留在編號右邊、調性右邊、關閉左邊（精簡版面只留編號右邊）；
			     文字按鈕（toolbar-item）之間不放分隔線，用間距隔開 -->
			<span class="separator wide-only">|</span>
			<label class="print-button wide-only toolbar-item">列印</label>
			<label class="play-button wide-only toolbar-item">播放</label>
			<div id="player-set" class="hide">
				<div id="player-control"></div>
			</div>
			<!-- 「檢視」：譜面的顯示方式與譜紙（js/score-view.js）。工具列不夠寬時文字換成 icon（文件和指向上下邊的箭頭） -->
			<span id="view_group" class="toolbar-item">
				<div id="view_button" title="檢視" aria-label="檢視" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-controls="view-menu"><span class="wide-only" aria-hidden="true">檢視</span><svg class="icon compact-only" viewBox="0 0 24 24" aria-hidden="true">
						<rect x="4.5" y="1.5" width="15" height="21" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
						<path d="M12 4 15 8H9ZM12 20 15 16H9Z"/>
					</svg></div>
				<div id="view-menu" class="hide menu" role="menu">
					<span class="menu-item" data-fit="page" role="menuitemradio" tabindex="0">整頁可見</span>
					<span class="menu-item" data-fit="height" role="menuitemradio" tabindex="0">符合高度</span>
					<span class="menu-item" data-fit="width" role="menuitemradio" tabindex="0">符合寬度</span>
					<span class="menu-separator" role="separator"></span>
					<span class="menu-item" data-paper="a4" role="menuitemradio" tabindex="0">分頁</span>
					<span class="menu-item" data-paper="content" role="menuitemradio" tabindex="0">不分頁</span>
				</div>
			</span>
			<!-- 「排版」：所有歌共用的排版設定，一個設定一列（js/layout-panel.js）。工具列不夠寬時按鈕收進「⋮」選單，
			     面板留在這裡（群組寬度變 0，緊鄰「⋮」），從「⋮」打開；data-compact-button 是那時焦點要還給的按鈕 -->
			<span id="layout_group" class="toolbar-item">
				<div id="layout_button" class="wide-only" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" aria-controls="layout-panel" data-compact-button="#more_button">排版</div>
				<div id="layout-panel" class="hide menu" role="dialog" aria-label="排版">
					<div class="layout-row">
						<span class="layout-label" id="layout_equalize_label">行間距均等化</span>
						<span class="layout-toggle" data-layout-toggle="equalize" role="switch" tabindex="0" aria-labelledby="layout_equalize_label"></span>
					</div>
					<div class="layout-row">
						<span class="layout-label" id="layout_line_gap_label">行距</span>
						<span class="step-button" data-layout-step="line_gap" data-steps="-1" title="行距縮小" aria-label="行距縮小" role="button" tabindex="0">−</span>
						<output class="layout-value" data-layout-value="line_gap" aria-labelledby="layout_line_gap_label"></output>
						<span class="step-button" data-layout-step="line_gap" data-steps="1" title="行距加大" aria-label="行距加大" role="button" tabindex="0">+</span>
					</div>
					<div class="layout-row">
						<span class="layout-label" id="layout_staff_width_label">譜面寬度</span>
						<span class="step-button" data-layout-step="staff_width" data-steps="-1" title="譜面寬度減少（譜變大）" aria-label="譜面寬度減少（譜變大）" role="button" tabindex="0">−</span>
						<output class="layout-value" data-layout-value="staff_width" aria-labelledby="layout_staff_width_label"></output>
						<span class="step-button" data-layout-step="staff_width" data-steps="1" title="譜面寬度增加（譜變小）" aria-label="譜面寬度增加（譜變小）" role="button" tabindex="0">+</span>
					</div>
					<div class="layout-row">
						<span class="layout-label" id="layout_lyric_size_label">歌詞字級</span>
						<span class="step-button" data-layout-step="lyric_size" data-steps="-1" title="歌詞字縮小" aria-label="歌詞字縮小" role="button" tabindex="0">−</span>
						<output class="layout-value" data-layout-value="lyric_size" aria-labelledby="layout_lyric_size_label"></output>
						<span class="step-button" data-layout-step="lyric_size" data-steps="1" title="歌詞字放大" aria-label="歌詞字放大" role="button" tabindex="0">+</span>
					</div>
					<div class="layout-row">
						<span class="layout-label" id="layout_chord_size_label">和弦字級</span>
						<span class="step-button" data-layout-step="chord_size" data-steps="-1" title="和弦字縮小" aria-label="和弦字縮小" role="button" tabindex="0">−</span>
						<output class="layout-value" data-layout-value="chord_size" aria-labelledby="layout_chord_size_label"></output>
						<span class="step-button" data-layout-step="chord_size" data-steps="1" title="和弦字放大" aria-label="和弦字放大" role="button" tabindex="0">+</span>
					</div>
					<span class="menu-separator" role="separator"></span>
					<span class="menu-item" id="page_break_mode" role="button" tabindex="0">設定分頁…</span>
					<span class="menu-separator" role="separator"></span>
					<span class="menu-item" id="layout_reset" role="button" tabindex="0">重設</span>
				</div>
			</span>
			<!-- 「編輯」選單不放在按鈕裡面，和「檢視」一樣沒有遮罩（js/dom.js 的 setup_dropdown） -->
			<span id="edit_group" class="wide-only toolbar-item">
				<label id="edit_button" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">編輯</label>
				<div id="editor-menu" class="hide menu" role="menu">
					<label class="chord-editor-item menu-item" role="menuitem" tabindex="0">和弦編輯器</label>
					<label class="song-editor-item menu-item" role="menuitem" tabindex="0">進階編輯器</label>
				</div>
			</span>
			<!-- 工具列不夠寬時，列印、播放、編輯、排版收在這個選單裡 -->
			<span id="more_group" class="compact-only">
				<div id="more_button" title="更多" aria-label="更多" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
					</svg>
				</div>
				<div id="more-menu" class="hide menu" role="menu">
					<span class="print-button menu-item" role="menuitem" tabindex="0">列印</span>
					<span class="play-button menu-item" role="menuitem" tabindex="0">播放</span>
					<span class="chord-editor-item menu-item" role="menuitem" tabindex="0">和弦編輯器</span>
					<span class="song-editor-item menu-item" role="menuitem" tabindex="0">進階編輯器</span>
					<span class="menu-separator" role="separator"></span>
					<span class="menu-item" data-open-menu="#layout_button" role="menuitem" tabindex="0" aria-haspopup="dialog">排版…</span>
				</div>
			</span>
			<span class="separator wide-only">|</span>
			<label id="close_score_button" data-close='#score_popup_container' title="關閉" aria-label="關閉" role="button" tabindex="0">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M5 5 19 19M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
				</svg>
			</label>
		</div>
	</div>
  <div id="info-popup-container">
    <div class="popup-bg">
        <div id="info-popup-window">
            <div class="popup-window-title">
                <button class="popup-window-close"></button>
            </div>
            <div class="popup-window-content"></div>
        </div>
    </div>
</div>
  <div id="feedback_popup" class="">
		<div id="feedback_popup_content" class="no-select">找不到想找的歌嗎？
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdwK5DtTSFJ_1kFJcCZlXpzxbDf5iEUy4tYEn0aFHWpKtdhSg/viewform?usp=sf_link">
      反應意見
      </a>
    </div>
	</div>
</body>
</html>
